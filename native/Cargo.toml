[package]
name = "osmium-native"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "UniFFI wrapper around the riti Bengali input engine for Osmium keyboard"

[lib]
name = "osmium_native"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
riti = { git = "https://github.com/OpenBangla/riti", rev = "e1fd5a809b0c3bf9c36e6f076ef6d558f9663fba" }
uniffi = { version = "0.25.3", features = ["build", "cli"] }
