  - Writing
License: MPL-2.0
AuthorName: Osmium contributors
SourceCode: https://github.com/Readest-Musta/Osmium
IssueTracker: https://github.com/Readest-Musta/Osmium/issues
Changelog: https://github.com/Readest-Musta/Osmium/releases
Summary: Bengali keyboard for Android with no tracking
Description: |
  Osmium is an open-source Bengali input method built on the riti engine.

  Features:
  * Avro Phonetic and Probhat layouts, plus an English (ASCII) mode
  * On-device suggestions with incognito mode and no learning in private fields
  * Emoji/symbol, clipboard and text-navigation panels
  * No INTERNET permission, no analytics, no tracking, no cloud backup

  All user data stays in the app's private storage on the device.
RepoType: git
Repo: https://github.com/Readest-Musta/Osmium
Builds:
