    versionCode: 126
    commit: v0.1.26
    gradle:
      - assembleRelease
    output: app/build/outputs/apk/release/app-release-unsigned.apk
AutoUpdateMode: Version
UpdateCheck: Tag
MaintainerNotes: |
  The native riti library and the UniFFI Kotlin bindings are generated by
  scripts/build-native.sh before Gradle runs. That script needs a Rust
  toolchain, cargo-ndk and Android NDK 27.0.12077973, which the default
  F-Droid build image does not provide. Before enabling this recipe, either
  provision those tools in the build environment or vendor prebuilt JNI libs.

  Release signing is conditional in app/build.gradle.kts. With no keystore in
  the build environment `assembleRelease` emits an unsigned APK, which is what
  F-Droid expects (F-Droid signs the artifact itself).

  This metadata is a SKELETON: the v0.1.16 tag does not exist until the
  controller publishes the release, and the build recipe has not been run by
  fdroidserver yet.
